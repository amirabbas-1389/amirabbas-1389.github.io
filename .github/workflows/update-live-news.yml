name: Update Orynt Live News

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update election news feed
        run: python scripts/update_live_news.py

      - name: Commit updated feed
        run: |
          git config user.name "orynt-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-news.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Auto-update US midterm Live News"
            git push
          fi
