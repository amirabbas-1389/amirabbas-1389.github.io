name: Refresh ORYNT Live News

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and build source-first feed
        shell: python
        run: |
          import json, re
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET

          sources = [
              ("NASA", "SPACE", "https://www.nasa.gov/rss/dyn/breaking_news.rss"),
              ("Nature", "SCIENCE", "https://www.nature.com/nature.rss"),
          ]

          def text_of(node, names):
              for name in names:
                  child = node.find(name)
                  if child is not None and child.text:
                      return re.sub(r"\s+", " ", child.text).strip()
              return ""

          items = []
          for source, category, feed_url in sources:
              try:
                  req = Request(feed_url, headers={"User-Agent":"ORYNT-Live-News/1.0"})
                  data = urlopen(req, timeout=20).read()
                  root = ET.fromstring(data)
                  for item in root.findall(".//item")[:8]:
                      title = text_of(item, ["title"])
                      url = text_of(item, ["link"])
                      summary = text_of(item, ["description"])
                      date_raw = text_of(item, ["pubDate"])
                      if not title or not url:
                          continue
                      summary = re.sub(r"<[^>]+>", " ", summary)
                      summary = re.sub(r"\s+", " ", summary).strip()
                      if len(summary) > 260:
                          summary = summary[:257].rsplit(" ",1)[0] + "..."
                      try:
                          dt = parsedate_to_datetime(date_raw).astimezone(timezone.utc)
                          stamp = dt.strftime("%d %b %Y · %H:%M UTC")
                      except Exception:
                          stamp = date_raw or ""
                      items.append({"title":title,"summary":summary or "Read the original source for the full update.","url":url,"source":source,"category":category,"time":stamp})
              except Exception as exc:
                  print("Source skipped:", source, exc)

          items.sort(key=lambda x: x["time"], reverse=True)
          items = items[:12]
          with open("live-news.json","w",encoding="utf-8") as f:
              json.dump(items,f,ensure_ascii=False,indent=2)
          print("Wrote", len(items), "items")
